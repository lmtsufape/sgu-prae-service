# PROFILE DOCKER
spring:
  config:
    activate:
      on-profile: docker

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://backend-db:5432/prae
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak.auth-server-url}realms/${keycloak.realm}/protocol/openid-connect/certs

keycloak:
  auth-server-url: http://keycloak:8080/
  realm: sgu-ufape
  client-id: sgu-application
  client-secret: iIueertdxnoPmpoA1Fsy6BfjMVbEa1d5

eureka:
